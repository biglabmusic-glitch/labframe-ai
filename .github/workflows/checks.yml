name: LabFrame checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labframe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_URL: http://localhost
      SUPABASE_ANON_KEY: fixture
      SUPABASE_SERVICE_ROLE_KEY: fixture
      POLZA_API_KEY: fixture
      REPLICATE_API_TOKEN: fixture
      BOT_TOKEN: fixture
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '2.9.5'
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm audit --audit-level=low
        working-directory: app
      - run: node scripts/check-secrets.mjs
      - name: Telegram identity and startup regressions
        run: deno test --allow-net=deno.land:443 scripts/test-telegram-sdk.ts scripts/test-startup.ts scripts/test-main-action.ts
      - name: Server, encryption and mask tests
        run: deno test --allow-env --allow-read --allow-net=deno.land:443 --unstable-sloppy-imports supabase/functions scripts/test-smile-mask-region.ts scripts/test-mask-tools.ts scripts/test-job-request.ts
      - name: Atomic job and permissions tests
        run: |
          psql -h localhost -U postgres -d labframe_test -v ON_ERROR_STOP=1 -f tests/fixtures/jobs-schema.sql
          psql -h localhost -U postgres -d labframe_test -v ON_ERROR_STOP=1 -f "$(find supabase/migrations -name '*_job_resilience.sql')"
          psql -h localhost -U postgres -d labframe_test -v ON_ERROR_STOP=1 -f tests/job-resilience.sql
